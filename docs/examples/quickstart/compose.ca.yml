# Isolated evaluation only: software KMS and insecure SQL over a private network.
# Run from the repository root with --env-file .env.
# Only the mTLS proxy publishes a port; the CA application stays private.
services:
  ca:
    build:
      context: ../../..
      dockerfile: docs/examples/quickstart/Dockerfile.database-client
      args: { PKICA_SERVICE: ca }
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    environment:
      PKICA_SERVICE_NAME: ca
      PKICA_ENVIRONMENT: ${PKICA_ENVIRONMENT:-development}
      PKICA_DATABASE_URL: ${DB_SQL_URL:-cockroachdb+psycopg://root@${DB_HOST_IP:?set DB_HOST_IP}:26257/pkica?sslmode=disable}
      PKICA_CA_KEY_BACKEND: ${CA_KEY_BACKEND:-software}
      PKICA_ALLOW_SOFTWARE_KMS: ${ALLOW_SOFTWARE_KMS:-true}
      PKICA_SOFTWARE_KMS_MASTER_KEY: ${SOFTWARE_KMS_MASTER_KEY:?set SOFTWARE_KMS_MASTER_KEY}
      PKICA_AUDIT_HASH_CHAIN_SECRET: ${AUDIT_HASH_CHAIN_SECRET:?set AUDIT_HASH_CHAIN_SECRET}
    volumes:
      - software-kms-data:/data/software-kms
    networks: [ca-internal, ca-uplink]

  ca-mtls-proxy:
    build: { context: ../../.., dockerfile: services/ca-mtls-proxy/Dockerfile }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    ports:
      - "${CA_HOST_IP:?set CA_HOST_IP to this host's private IPv4 address}:8443:8443"
    volumes:
      - ../../../certs/ca-mtls-proxy.crt:/certs/server.crt:ro
      - ../../../certs/ca-mtls-proxy.key:/certs/server.key:ro
      - ../../../certs/infra-ca.crt:/certs/internal-ca.crt:ro
    networks: [ca-internal, ca-ingress]
    depends_on: [ca]

networks:
  ca-internal:
    internal: true
  ca-uplink:
    driver: bridge
  ca-ingress:
    driver: bridge

volumes:
  software-kms-data:
