worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server_tokens off;
    client_max_body_size 64k;

    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # nginx has no built-in "CN only" variable for the client cert subject;
    # extract it from $ssl_client_s_dn (e.g. "CN=ra,O=ACME").
    map $ssl_client_s_dn $ssl_client_s_dn_cn {
        default "";
        "~CN=(?<CN>[^,]+)" $CN;
    }

    # Docker's embedded DNS (127.0.0.11) resolves service names to container
    # IPs at request time via the variables below, instead of nginx's default
    # of resolving `upstream {}` blocks once at config load — which fails to
    # start if a backend isn't up yet and never picks up a backend's new IP
    # after it restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8443 ssl default_server;
        http2 on;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        limit_req zone=general burst=40 nodelay;
        limit_conn conn_limit 20;

        # EST requires optional client-certificate re-enrollment support.
        ssl_client_certificate /certs/client-ca-bundle.crt;
        ssl_verify_client optional;

        location /api/ {
            set $upstream ra:8000;
            proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
            proxy_set_header X-Client-Cert-CN $ssl_client_s_dn_cn;
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://$upstream;
        }

        location /acme/ {
            set $upstream acme:8000;
            proxy_pass http://$upstream/;
        }
        location = /directory {
            set $upstream acme:8000;
            proxy_pass http://$upstream/directory;
        }

        location /.well-known/est/ {
            set $upstream est:8000;
            proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
            proxy_set_header X-Client-Cert-CN $ssl_client_s_dn_cn;
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://$upstream/.well-known/est/;
        }

        location /scep {
            set $upstream scep:8000;
            proxy_pass http://$upstream/scep;
        }

        location /ocsp/ {
            set $upstream ocsp:8000;
            proxy_pass http://$upstream/ocsp/;
        }

        location /crl/ {
            set $upstream crl:8000;
            proxy_pass http://$upstream/crl/;
        }

        location = /healthz {
            return 200 "ok";
        }
    }
}
