worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server_tokens off;

    # nginx has no built-in "CN only" variable for the client cert subject;
    # extract it from $ssl_client_s_dn (e.g. "CN=ra,O=ACME").
    map $ssl_client_s_dn $ssl_client_s_dn_cn {
        default "";
        "~CN=(?<CN>[^,]+)" $CN;
    }

    # Resolve `ca` at request time via Docker's embedded DNS rather than
    # baking in a single resolution at config load (nginx `upstream {}`
    # blocks only resolve once and fail to start if the backend isn't up yet).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8443 ssl;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_client_certificate /certs/internal-ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;

        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;

        # Defense in depth: strip any client-supplied identity headers before
        # we set the verified ones below, so a caller cannot spoof its peer CN.
        proxy_set_header X-Client-Cert-Verify "";
        proxy_set_header X-Client-Cert-CN "";

        location / {
            if ($ssl_client_verify != SUCCESS) {
                return 495;
            }
            set $upstream ca:8000;
            proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
            proxy_set_header X-Client-Cert-CN $ssl_client_s_dn_cn;
            proxy_set_header Host $host;
            proxy_pass http://$upstream;
        }
    }
}
