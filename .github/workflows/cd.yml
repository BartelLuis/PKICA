name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write   # required for keyless cosign signing + provenance attestation
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/pkica

jobs:
  publish:
    name: Build, scan, sign & publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ca
          - ra
          - ocsp
          - crl
          - acme
          - est
          - scep
          - gateway
          - ca-mtls-proxy
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          image_name="$(printf '%s' "${IMAGE_NAMESPACE}-${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${REGISTRY}/${image_name}" >> "$GITHUB_OUTPUT"

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build once, locally, so we can scan before ever pushing anything.
      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Generate throwaway dev certificates for nginx validation
        if: matrix.service == 'gateway' || matrix.service == 'ca-mtls-proxy'
        run: |
          python3 -m pip install --quiet cryptography
          python3 scripts/generate-dev-certs.py

      - name: Validate gateway nginx configuration
        if: matrix.service == 'gateway'
        run: |
          docker run --rm --user 0:0 \
            -v "${PWD}/certs/gateway.crt:/certs/server.crt:ro" \
            -v "${PWD}/certs/gateway.key:/certs/server.key:ro" \
            -v "${PWD}/certs/client-ca-bundle.crt:/certs/client-ca-bundle.crt:ro" \
            "${{ fromJSON(steps.meta.outputs.json).tags[0] }}" nginx -t

      - name: Validate CA mTLS proxy nginx configuration
        if: matrix.service == 'ca-mtls-proxy'
        run: |
          docker run --rm --user 0:0 \
            -v "${PWD}/certs/ca-mtls-proxy.crt:/certs/server.crt:ro" \
            -v "${PWD}/certs/ca-mtls-proxy.key:/certs/server.key:ro" \
            -v "${PWD}/certs/infra-ca.crt:/certs/internal-ca.crt:ro" \
            "${{ fromJSON(steps.meta.outputs.json).tags[0] }}" nginx -t

      - name: Scan image (trivy) — blocks publish on CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Attach SBOM as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 90

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Keyless-sign image with cosign (Sigstore/Fulcio, via GitHub OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"

  summary:
    name: Publish summary
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - run: echo "All PKICA service images built, scanned, signed and published to GHCR."
