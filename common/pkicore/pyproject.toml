[project]
name = "pkicore"
version = "0.1.0"
description = "Shared core library for the PKICA enterprise PKI platform"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "asn1crypto>=1.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "boto3>=1.34",
    "azure-keyvault-keys>=4.9",
    "azure-identity>=1.16",
    "google-cloud-kms>=2.21",
    "hvac>=2.1",
    "python-pkcs11>=0.7.0",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
]

[tool.setuptools.packages.find]
include = ["pkicore*"]
